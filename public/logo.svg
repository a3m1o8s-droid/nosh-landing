<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C36A"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#B8912E"/>
    </linearGradient>
  </defs>

  <!-- N with integrated fork on the right stroke -->
  <g fill="url(#gold-grad)">
    <!-- Left vertical stroke of N -->
    <rect x="12" y="12" width="9" height="56" rx="3"/>
    <!-- Diagonal of N -->
    <polygon points="21,14 52,62 52,68 61,68 61,62 30,14 30,12 21,12"/>
    <!-- Right stroke of N — becomes a fork -->
    <!-- Fork handle (bottom part of right stroke) -->
    <rect x="52" y="38" width="9" height="30" rx="3"/>
    <!-- Fork head — 3 tines -->
    <rect x="49" y="12" width="4" height="22" rx="2"/>
    <rect x="55" y="12" width="4" height="22" rx="2"/>
    <rect x="61" y="12" width="4" height="22" rx="2"/>
    <!-- Fork bridge connecting tines -->
    <rect x="49" y="30" width="16" height="4" rx="2"/>
  </g>

  <!-- "nosh" text -->
  <text x="82" y="57" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="42" fill="url(#gold-grad)" letter-spacing="-1">
    nosh
  </text>

  <!-- Small plate/circle accent under the text -->
  <ellipse cx="160" cy="68" rx="32" ry="2.5" fill="#D4A853" opacity="0.25"/>
</svg>
